name: Build WSTunnel Multi-Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:buster

    steps:
      # ----------------------------------------------------------
      # Debian 10/Buster is archived
      # ----------------------------------------------------------
      - name: Configure Debian 10 archive repositories
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian buster main contrib non-free
          deb http://archive.debian.org/debian-security buster/updates main contrib non-free
          EOF

          cat > /etc/apt/apt.conf.d/99archive <<'EOF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          EOF

          apt-get update

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          apt-get install -y \
            ca-certificates \
            curl \
            git \
            gcc \
            libc6-dev \
            file \
            tar

      # ----------------------------------------------------------
      # Go
      # ----------------------------------------------------------
      - name: Install Go
        run: |
          curl -L \
            https://go.dev/dl/go1.25.7.linux-amd64.tar.gz \
            -o /tmp/go.tar.gz

          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz

          /usr/local/go/bin/go version

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git status || true

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------
      - name: Download Go dependencies
        env:
          PATH: /usr/local/go/bin:/usr/local/bin:/usr/bin:/bin
          GOFLAGS: "-buildvcs=false"
        run: |
          go mod download

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build all platforms
        env:
          PATH: /usr/local/go/bin:/usr/local/bin:/usr/bin:/bin
          CGO_ENABLED: "0"
          GOFLAGS: "-buildvcs=false"
        run: |
          set -e

          mkdir -p build

          echo
          echo "========================================"
          echo " Debian 9.11 AMD64"
          echo "========================================"

          GOOS=linux GOARCH=amd64 GOAMD64=v1 \
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w" \
            -o build/wstunnel-debian9.11-amd64 \
            cli.go


          echo
          echo "========================================"
          echo " Debian 10 AMD64"
          echo "========================================"

          GOOS=linux GOARCH=amd64 GOAMD64=v1 \
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w" \
            -o build/wstunnel-debian10-amd64 \
            cli.go


          echo
          echo "========================================"
          echo " Debian 12 AArch64"
          echo "========================================"

          GOOS=linux GOARCH=arm64 \
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w" \
            -o build/wstunnel-debian12-aarch64 \
            cli.go


          echo
          echo "========================================"
          echo " Windows AMD64"
          echo "========================================"

          GOOS=windows GOARCH=amd64 GOAMD64=v1 \
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w" \
            -o build/wstunnel-windows-amd64.exe \
            cli.go


          echo
          echo "========================================"
          echo " Windows ARM64"
          echo "========================================"

          GOOS=windows GOARCH=arm64 \
          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w" \
            -o build/wstunnel-windows-arm64.exe \
            cli.go


          echo
          echo "========================================"
          echo " Build results"
          echo "========================================"

          ls -lh build/

          echo
          echo "File types:"
          file build/*

          echo
          echo "SHA256:"
          sha256sum build/*

      # ----------------------------------------------------------
      # Test native Linux AMD64 build
      # ----------------------------------------------------------
      - name: Test Linux AMD64 binary
        run: |
          chmod +x build/wstunnel-debian9.11-amd64

          echo "===== WSTunnel CLI ====="
          ./build/wstunnel-debian9.11-amd64 --help

      # ----------------------------------------------------------
      # Individual artifacts
      # ----------------------------------------------------------
      - name: Upload Debian 9.11 AMD64
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-debian9.11-amd64
          path: build/wstunnel-debian9.11-amd64
          if-no-files-found: error

      - name: Upload Debian 10 AMD64
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-debian10-amd64
          path: build/wstunnel-debian10-amd64
          if-no-files-found: error

      - name: Upload Debian 12 AArch64
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-debian12-aarch64
          path: build/wstunnel-debian12-aarch64
          if-no-files-found: error

      - name: Upload Windows AMD64
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-windows-amd64
          path: build/wstunnel-windows-amd64.exe
          if-no-files-found: error

      - name: Upload Windows ARM64
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-windows-arm64
          path: build/wstunnel-windows-arm64.exe
          if-no-files-found: error

      # ----------------------------------------------------------
      # Everything together
      # ----------------------------------------------------------
      - name: Upload complete WSTunnel package
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-all-platforms
          path: |
            build/wstunnel-debian9.11-amd64
            build/wstunnel-debian10-amd64
            build/wstunnel-debian12-aarch64
            build/wstunnel-windows-amd64.exe
            build/wstunnel-windows-arm64.exe
          if-no-files-found: error

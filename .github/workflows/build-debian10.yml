      - name: Build WSTunnel for Debian 10 amd64
        env:
          PATH: /usr/local/go/bin:/usr/local/bin:/usr/bin:/bin
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOFLAGS: "-buildvcs=false"
        run: |
          echo "===== Go ====="
          go version

          echo "===== Repository ====="
          pwd
          ls -la

          echo "===== Build ====="
          mkdir -p build

          go mod download

          go build \
            -buildvcs=false \
            -trimpath \
            -ldflags="-s -w" \
            -o build/wstunnel \
            cli.go

          echo "===== Result ====="
          file build/wstunnel
          ls -lh build/wstunnel
          sha256sum build/wstunnel

          echo "===== CLI ====="
          ./build/wstunnel --help
